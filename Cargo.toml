[package]
name = "cargo-wrap-comments"
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jambolo/cargo-wrap-comments"
description = "A CLI tool that reformats source code comments to wrap at a specified width."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
glob = "0.3.4"
toml = "1.1.8"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
